  <!-- メイン -->
  <main class="main">
    <header class="topbar">
      <button class="btn ghost icon dOnly" id="menuBtn" type="button" aria-label="メニュー"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="viewTitle" id="viewTitle">ホーム</div>
      <button class="omni" id="omniBtn" type="button"><svg class="i"><use href="#i-search"/></svg><span>駅・予定・ツールを検索</span><kbd class="hideM">Ctrl K</kbd></button>
      <button class="syncPill" id="syncBtn" type="button" title="今すぐ同期"><i></i><span class="lbl" id="syncLabel">ローカル保存</span></button>
      <button class="btn ghost icon mOnly" id="gearBtn" type="button" title="設定" aria-label="設定"><svg class="i"><use href="#i-cog"/></svg></button>
      <button class="btn ghost icon" id="paneBtn" type="button" title="タスク一覧を開閉" aria-label="タスク一覧を開閉"><svg class="i"><use href="#i-sideR"/></svg></button>
    </header>

    <div class="views">
      <!-- HOME -->
      <section class="view" id="view-home" aria-label="ホーム">
        <div class="home">
          <div class="dayHead">
            <div class="date" id="homeDate"></div>
            <div class="wxNow" id="wxNow"><div class="wxIcon" id="wxIcon"></div><div><b id="wxTemp">--℃</b><small id="wxText">天気を取得しています</small></div></div>
            <div class="wxStrip" id="wxStrip">
              <div id="wxCells" style="display:flex"></div>
              <div class="wxTools"><button type="button" data-wx="hours" aria-pressed="true">これから</button><button type="button" data-wx="week" aria-pressed="false">週間</button></div>
            </div>
          </div>
          <div class="quickRow" id="homeQuick" role="group" aria-label="AIと、すばやい操作">
            <button type="button" class="aiBrief" id="homeAiCard" aria-label="AIアシスタントに相談する"><span class="aiBriefAv" id="homeAiAv"><img class="kn-icon" alt="" aria-hidden="true" src="./assets/avatar/i/smile.webp?v=20261004-av2" width="56" height="56"></span><span class="aiBriefTx"><b id="homeAiMsg">お疲れさまです。</b><small>タップしてAIに相談（予定の確認・資料の読み取り）</small></span><svg class="i aiBriefGo" aria-hidden="true"><use href="#i-right"/></svg></button>
            <button type="button" class="qTile" data-q="event"><span class="qIc"><svg class="i"><use href="#i-cal"/></svg></span><span class="qTx"><b>予定を追加</b><small>日時と場所を登録</small></span></button>
            <button type="button" class="qTile" data-q="task"><span class="qIc"><svg class="i"><use href="#i-check"/></svg></span><span class="qTx"><b>タスクを追加</b><small>やることを記録</small></span></button>
          </div>
          <div class="homeLeft">
            <section class="panel" style="flex:1;min-height:300px">
              <div class="panelHead"><h3>予定<small id="homeAgendaSub">今日から7日間</small></h3><button class="btn sm" type="button" id="homeNewEvent"><svg class="i" style="width:15px;height:15px"><use href="#i-plus"/></svg>予定</button><a class="btn sm ghost" href="#calendar">カレンダーを開く</a></div>
              <div class="agenda" id="homeAgenda"></div>
            </section>
            <section class="panel">
              <div class="panelHead"><h3>現行案件<small>クリックで地図、フォルダアイコンで案件フォルダ</small></h3><button class="btn sm ghost" type="button" id="openRootFolder" title="工事管理フォルダを開く"><svg class="i" style="width:15px;height:15px"><use href="#i-folder"/></svg>全フォルダ</button></div>
              <div class="curList" id="curList"></div>
            </section>
          </div>
          <section class="panel homeMap">
            <div class="panelHead"><h3>小田急マップ</h3><a class="btn sm ghost" href="#map">大きく表示</a></div>
            <div class="mapSlot" id="homeMapSlot"></div>
          </section>
        </div>
      </section>

      <!-- CALENDAR -->
      <section class="view fill" id="view-calendar" aria-label="カレンダー">
        <div class="cal">
          <aside class="calSide" id="calSide">
            <button class="btn primary" type="button" id="calNew"><svg class="i"><use href="#i-plus"/></svg>新しい予定</button>
            <div class="mini" id="miniCal"></div>
            <div class="sideSec"><h4>種別<button type="button" id="catAllBtn">すべて表示</button></h4><div id="catList"></div></div>
            <div class="sideSec"><h4>表示</h4>
              <label class="catRow" id="togTasks" style="--c:var(--ink-3)"><span class="catBox"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>タスク（期日あり）</label>
              <label class="catRow" id="togHol" style="--c:var(--danger)"><span class="catBox"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>日本の祝日</label>
            </div>
            <div class="sideSec hint">キー操作：<kbd>N</kbd> 新規 <kbd>T</kbd> 今日 <kbd>←</kbd><kbd>→</kbd> 前後 <kbd>D</kbd><kbd>R</kbd><kbd>W</kbd><kbd>M</kbd><kbd>A</kbd> 表示切替 <kbd>?</kbd> 一覧</div>
          </aside>
          <div class="calMain">
            <div class="calBar">
              <button class="btn ghost icon sm" type="button" id="calSideBtn" title="サイドパネル"><svg class="i"><use href="#i-sideL"/></svg></button>
              <button class="btn sm" type="button" id="calToday">今日</button>
              <button class="btn ghost icon sm" type="button" id="calPrev" aria-label="前へ"><svg class="i"><use href="#i-left"/></svg></button>
              <button class="btn ghost icon sm" type="button" id="calNext" aria-label="次へ"><svg class="i"><use href="#i-right"/></svg></button>
              <div class="calRange num" id="calRange"></div>
              <div class="calTools">
                <div class="seg" id="calViews" role="group" aria-label="表示">
                  <button type="button" data-v="day">日</button><button type="button" data-v="workweek">稼働日</button><button type="button" data-v="week">週</button><button type="button" data-v="month">月</button><button type="button" data-v="list">一覧</button>
                </div>
                <label class="calSearch"><svg class="i"><use href="#i-search"/></svg><input id="calSearch" placeholder="予定を検索" autocomplete="off"></label>
                <button class="btn ghost icon sm" type="button" id="calMore" aria-label="その他"><svg class="i"><use href="#i-dots"/></svg></button>
              </div>
            </div>
            <div class="calBody" id="calBody"></div>
          </div>
        </div>
      </section>

      <!-- MAP -->
      <section class="view fill" id="view-map" aria-label="小田急マップ">
        <div class="mapSlot" id="mapViewSlot"></div>
      </section>

      <!-- TOOL -->
      <section class="view fill" id="view-tool" aria-label="ツール">
        <div class="toolBar"><span class="desc" id="toolDesc"></span>
          <button class="btn sm ghost" type="button" id="toolReload"><svg class="i" style="width:15px;height:15px"><use href="#i-reload"/></svg>再読み込み</button>
          <a class="btn sm" id="toolOpenTab" target="_blank" rel="noopener"><svg class="i" style="width:15px;height:15px"><use href="#i-ext"/></svg>別タブで開く</a>
        </div>
        <iframe class="toolFrame" id="toolFrame" title="ツール"></iframe>
      </section>
    </div>
  </main>

  <!-- タスクペイン -->
  <aside class="pane" id="pane" aria-label="タスク">
    <div class="paneHead"><h2>タスク<small class="num" id="taskSummary"></small></h2><button class="btn ghost icon sm" type="button" id="paneClose" aria-label="閉じる"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="quickAdd">
      <form class="row" id="taskQuick" autocomplete="off"><input class="input" id="taskQuickInput" placeholder="タスクを追加（Enterで登録）"><button class="btn icon" type="button" id="taskDetailBtn" title="詳細を指定して追加"><svg class="i"><use href="#i-plus"/></svg></button></form>
      <div class="row" style="justify-content:space-between">
        <div class="taskTabs" id="taskTabs"><button type="button" data-f="open" aria-pressed="true">未完了</button><button type="button" data-f="today" aria-pressed="false">今日</button><button type="button" data-f="station" aria-pressed="false">駅付き</button><button type="button" data-f="done" aria-pressed="false">完了</button></div>
      </div>
      <input class="input" id="taskSearch" placeholder="絞り込み" style="height:30px;font-size:12.5px">
    </div>
    <div class="taskScroll" id="taskList"></div>
  </aside>
</div>
