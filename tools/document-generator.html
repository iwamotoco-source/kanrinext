<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>現場書類作成</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--panel:#0d1726;--panel2:#111d2e;--line:#263650;--text:#edf4ff;--muted:#8fa2bd;--accent:#4d86e8;--good:#49b98a;--danger:#e16969}:root[data-theme="light"]{color-scheme:light;--bg:#eef3fa;--panel:#fff;--panel2:#f7f9fc;--line:#d4deea;--text:#152033;--muted:#68778b;--accent:#316dce;--good:#268a64;--danger:#c94c4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"BIZ UDPGothic","Yu Gothic UI",sans-serif;font-size:14px}.wrap{max-width:1040px;margin:auto;padding:22px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.head h1{font-size:22px;margin:0 0 6px}.head p{margin:0;color:var(--muted);line-height:1.7}.pill{font-size:12px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.card h2{font-size:15px;margin:0 0 14px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:700}.input{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:0 12px;font:inherit;outline:none}.templates{display:grid;gap:8px}.tpl{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;cursor:pointer}.tpl input{width:17px;height:17px;accent-color:var(--accent)}.tpl b{display:block;font-size:13px}.tpl small{display:block;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{height:40px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.note{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;line-height:1.7}.status{display:none;margin-top:12px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);white-space:pre-wrap;line-height:1.6}.status.on{display:block}.status.ok{color:var(--good)}.status.err{color:var(--danger)}.sideRow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.sideRow:last-child{border-bottom:0}.sideRow span{color:var(--muted)}code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel2);padding:2px 5px;border-radius:5px}.local{margin-top:14px}.local input{display:block;width:100%;font-size:12px;color:var(--muted)}@media(max-width:780px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.head{display:block}.pill{display:inline-block;margin-top:10px}.card{padding:14px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>現場書類作成</h1><p>現場名を1回入力すると、登録済みのExcelひな形へ自動反映し、<br>「現場名_元ファイル名」で一括出力します。</p></div><span class="pill">Excelひな形 8種</span></div><div class="grid"><section class="card"><h2>1. 現場情報</h2><div class="field"><label for="project">現場名 / 工事件名 *</label><input class="input" id="project" placeholder="例：経堂駅 電気設備改修工事" autocomplete="off"></div><div class="field"><label for="number">工事番号（任意）</label><input class="input" id="number" placeholder="例：26-1234" autocomplete="off"></div><h2 style="margin-top:20px">2. 作成する書類</h2><div class="templates" id="templates"></div><div class="actions"><button class="btn" id="all" type="button">すべて選択</button><button class="btn" id="none" type="button">解除</button><button class="btn primary" id="generate" type="button">選択書類を一括作成</button></div><div class="status" id="status"></div><div class="local"><label style="font-size:12px;color:var(--muted)">初回：下の「ひな形パック」を選択すると端末に保存され、次回から選択不要です。</label><input id="fallback" type="file" multiple accept=".xlsx,.xlsm,.zip"></div></section><aside class="card"><h2>ひな形の処理内容</h2><div class="sideRow"><span>会社名・帳票骨組み</span><b>保持</b></div><div class="sideRow"><span>計器型式・製造番号等</span><b>保持</b></div><div class="sideRow"><span>現場固有の測定値</span><b>空欄化済み</b></div><div class="sideRow"><span>現場固有の日付・担当者</span><b>空欄化済み</b></div><div class="sideRow"><span>埋込写真・現場図</span><b>削除済み</b></div><div class="sideRow"><span>工事件名</span><b>自動入力</b></div><div class="sideRow"><span>出力形式</span><b>ZIP</b></div><div class="note">ファイル名は <code>現場名_照度_測定表(新設).xlsx</code> のようになります。<br><br>写真台帳は <b>.xlsm</b> のまま出力し、マクロを維持します。</div></aside></div></div><script src="./lib/jszip.min.js"></script><script>
'use strict';
const TEMPLATES=[{id:'lux-new',name:'照度測定表（新設）',file:'照度_測定表(新設).xlsx'},{id:'lux-old',name:'照度測定表（既存）',file:'照度_測定表(既存).xlsx'},{id:'notice',name:'工事のお知らせ',file:'工事のお知らせ.xlsx'},{id:'ky',name:'作業連絡／作業指示ーKY日報',file:'作業連絡／作業指示ーKY日報.xlsx'},{id:'photo',name:'写真台帳',file:'写真台帳作成(定型).xlsm'},{id:'insulation',name:'絶縁抵抗測定表',file:'絶縁抵抗_測定表.xlsx'},{id:'ground',name:'接地抵抗測定表',file:'接地抵抗_測定表.xlsx'},{id:'current',name:'電流測定表',file:'電流測定表.xlsx'}];
const $=id=>document.getElementById(id),status=$('status');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function safeName(s){return String(s).trim().replace(/[\\/:*?"<>|]/g,'_').replace(/[. ]+$/,'').slice(0,90)}function xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}function render(){$('templates').innerHTML=TEMPLATES.map(t=>`<label class="tpl"><input type="checkbox" data-id="${t.id}" checked><span><b>${esc(t.name)}</b><small>${esc(t.file)}</small></span></label>`).join('')}render();$('all').onclick=()=>document.querySelectorAll('[data-id]').forEach(x=>x.checked=true);$('none').onclick=()=>document.querySelectorAll('[data-id]').forEach(x=>x.checked=false);function show(msg,type=''){status.textContent=msg;status.className='status on '+type}
const DB='kanrinextDocTemplatesV1',STORE='files';function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putTpl(name,buf){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(buf,name);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}async function getTpl(name){const db=await openDb();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(name);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
$('fallback').onchange=async e=>{try{let count=0;for(const f of e.target.files){if(f.name.toLowerCase().endsWith('.zip')){const z=await JSZip.loadAsync(await f.arrayBuffer());for(const t of TEMPLATES){const zf=z.file(t.file);if(zf){await putTpl(t.file,await zf.async('arraybuffer'));count++}}}else if(TEMPLATES.some(t=>t.file===f.name)){await putTpl(f.name,await f.arrayBuffer());count++}}show(`ひな形を ${count} 件登録しました。次回から自動で使用します。`,'ok')}catch(err){show('ひな形登録に失敗しました。\n'+err.message,'err')}};
async function getTemplate(t){const saved=await getTpl(t.file);if(saved)return saved;try{const r=await fetch('./templates/'+encodeURIComponent(t.file));if(r.ok)return r.arrayBuffer()}catch(e){}throw new Error(`${t.file} が未登録です。ひな形パックを一度選択してください。`)}
async function personalize(buf,t,project,number){const zip=await JSZip.loadAsync(buf),repl={'{{現場名}}':project,'{{工事番号}}':number||''};for(const name of Object.keys(zip.files).filter(n=>/\.xml$/.test(n))){const f=zip.file(name);if(!f)continue;let s=await f.async('string'),before=s;for(const [a,b] of Object.entries(repl))s=s.split(a).join(xmlEsc(b));if(t.id==='photo'){s=s.replace(/工事件名：(?=<\/t>)/g,'工事件名：'+xmlEsc(project)).replace(/工事件名:(?=<\/t>)/g,'工事件名:'+xmlEsc(project))}if(s!==before)zip.file(name,s)}return zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}})}
$('generate').onclick=async()=>{const project=$('project').value.trim(),number=$('number').value.trim();if(!project){show('現場名を入力してください。','err');$('project').focus();return}const selected=TEMPLATES.filter(t=>document.querySelector(`[data-id="${t.id}"]`).checked);if(!selected.length){show('作成する書類を1つ以上選択してください。','err');return}const btn=$('generate');btn.disabled=true;show(`作成中… 0 / ${selected.length}`);try{const out=new JSZip();let n=0;for(const t of selected){const raw=await getTemplate(t),blob=await personalize(raw,t,project,number);out.file(`${safeName(project)}_${t.file}`,blob);n++;show(`作成中… ${n} / ${selected.length}\n${t.name}`)}const z=await out.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),a=document.createElement('a');a.href=URL.createObjectURL(z);a.download=`${safeName(project)}_現場書類一式.zip`;document.body.appendChild(a);a.click();const u=a.href;a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);show(`${selected.length}ファイルを作成しました。\n現場名「${project}」を各帳票へ反映済みです。`,'ok')}catch(e){console.error(e);show(`作成に失敗しました。\n${e.message}`,'err')}finally{btn.disabled=false}};(function(){const q=new URLSearchParams(location.search),t=q.get('theme');if(t)document.documentElement.dataset.theme=t;addEventListener('message',e=>{if(e.data?.type==='kouji-theme')document.documentElement.dataset.theme=e.data.theme})})();
</script></body></html>
