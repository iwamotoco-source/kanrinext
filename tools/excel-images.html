nt(135deg,#e2c173,#b68f42);color:#17130a}.btn:disabled{opacity:.35;cursor:not-allowed}.progress{display:none;margin-top:16px}.track{height:8px;background:#171d27;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#b58d40,#efd28a);transition:.2s}.progLine{display:flex;justify-content:space-between;font-size:9px;color:#788294;margin-top:6px}.result{display:none;margin-top:14px;padding:12px 13px;border-radius:11px;font-size:11px;line-height:1.6}.result.ok{display:block;border:1px solid rgba(120,198,154,.3);background:rgba(120,198,154,.07);color:#8dd5a8}.result.err{display:block;border:1px solid rgba(223,133,133,.3);background:rgba(223,133,133,.07);color:#eba0a0}.note{font-size:9px;color:#647083;margin-top:13px;line-height:1.7}</style>

<div id="suiteBar"><a class="suiteHome" href="../index.html">← ホーム</a><div class="suiteBrand"><b>Excel画像抽出</b><span>.xlsx 内の画像をシート別フォルダへ振り分けてZIP化</span></div></div>
<div class="wrap"><div class="hero"><h1>Excel Image Extractor</h1><p>Excelブック内の埋め込み画像を、シート名ごとのフォルダに自動整理してZIPで保存します。処理はブラウザ内で完結します。</p></div><div class="card"><div class="drop" id="drop"><div class="dropIcon">▦</div><b>.xlsx をここへドロップ</b><small>またはクリックしてファイルを選択</small><input id="file" type="file" accept=".xlsx" hidden></div><div class="fileInfo" id="fileInfo"><div><div class="fn" id="filename"></div><div class="fs" id="filesize"></div></div><span style="color:#d7b769">READY</span></div><div class="progress" id="progress"><div class="track"><div class="fill" id="fill"></div></div><div class="progLine"><span id="status">待機中</span><span id="percent">0%</span></div></div><div class="result" id="result"></div><div class="actions"><button class="btn" id="reset">リセット</button><button class="btn primary" id="start" disabled>画像を抽出</button></div><div class="note">対応形式：.xlsx。各シートに貼られた画像を、そのシート名のフォルダへ image1 / image2… の名前で格納します。外部送信は行いません。</div></div></div>
<script src="./lib/jszip.min.js"></script><script>
let selected=null;const $=id=>document.getElementById(id);function size(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB'}function xml(s){return new DOMParser().parseFromString(s,'application/xml')}const RID='http://schemas.openxmlformats.org/officeDocument/2006/relationships';function rid(el,a){return el.getAttributeNS(RID,a)||el.getAttribute('r:'+a)||''}function dir(p){const i=p.lastIndexOf('/');return i<0?'':p.slice(0,i)}function base(p){const i=p.lastIndexOf('/');return i<0?p:p.slice(i+1)}function resolve(b,t){if(!t)return null;if(t[0]==='/')return t.slice(1);const a=b?b.split('/').filter(Boolean):[];for(const p of t.split('/')){if(p==='..')a.pop();else if(p!=='.'&&p)a.push(p)}return a.join('/')}function safe(n,u){let s=(n||'sheet').replace(/[\\/:*?"<>|]/g,'_').trim()||'sheet';if(!u[s]){u[s]=1;return s}u[s]++;return s+'_'+u[s]}async function rels(z,p){const f=z.file(p);if(!f)return{};const d=xml(await f.async('string')),e=d.getElementsByTagName('Relationship'),m={};for(let i=0;i<e.length;i++)m[e[i].getAttribute('Id')]={target:e[i].getAttribute('Target'),type:e[i].getAttribute('Type')||''};return m}
async function extract(buf,cb){const z=await JSZip.loadAsync(buf),wf=z.file('xl/workbook.xml');if(!wf)throw new Error('workbook.xml が見つかりません');const wd=xml(await wf.async('string')),se=wd.getElementsByTagName('sheet'),ss=[];for(let i=0;i<se.length;i++)ss.push({name:se[i].getAttribute('name'),rid:rid(se[i],'id')});const wr=await rels(z,'xl/_rels/workbook.xml.rels');ss.forEach(s=>{const r=wr[s.rid];s.path=r?resolve('xl',r.target):null});const out=new JSZip(),used={};let total=0;for(let si=0;si<ss.length;si++){const s=ss[si];cb(Math.round(8+82*si/Math.max(1,ss.length)),'処理中: '+s.name+' ('+(si+1)+'/'+ss.length+')');if(!s.path||!z.file(s.path))continue;const sd=dir(s.path),sr=await rels(z,sd+'/_rels/'+base(s.path)+'.rels');let dp=null;for(const k in sr)if(sr[k].type.includes('drawing')){dp=resolve(sd,sr[k].target);break}if(!dp||!z.file(dp))continue;const dd=xml(await z.file(dp).async('string')),dr=await rels(z,dir(dp)+'/_rels/'+base(dp)+'.rels'),bl=dd.getElementsByTagNameNS('*','blip'),folder=safe(s.name,used);let count=0;for(let b=0;b<bl.length;b++){const er=dr[rid(bl[b],'embed')];if(!er)continue;const mp=resolve(dir(dp),er.target),mf=z.file(mp);if(!mf)continue;const data=await mf.async('uint8array');count++;total++;const ext=(mp.match(/\.([A-Za-z0-9]+)$/)||['','png'])[1];out.file(folder+'/image'+count+'.'+ext,data)}}cb(95,'ZIPを生成中');const blob=await out.generateAsync({type:'blob'});cb(100,'完了');return{blob,count:total}}
function setFile(f){$('result').className='result';$('result').style.display='none';if(!f||!/\.xlsx$/i.test(f.name)){selected=null;$('start').disabled=true;$('result').className='result err';$('result').textContent='.xlsx 形式のファイルを選択してください';return}selected=f;$('filename').textContent=f.name;$('filesize').textContent=size(f.size);$('fileInfo').classList.add('show');$('start').disabled=false}$('drop').onclick=()=>$('file').click();$('file').onchange=e=>setFile(e.target.files[0]);['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('drag')}));['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('drag')}));$('drop').addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));$('reset').onclick=()=>location.reload();$('start').onclick=()=>{if(!selected)return;if(!window.JSZip){$('result').className='result err';$('result').textContent='JSZipライブラリを読み込めませんでした。インターネット接続を確認してください。';return}$('start').disabled=true;$('progress').style.display='block';const r=new FileReader();r.onload=e=>extract(e.target.result,(p,s)=>{$('fill').style.width=p+'%';$('percent').textContent=p+'%';$('status').textContent=s}).then(x=>{if(!x.count){$('result').className='result err';$('result').textContent='埋め込み画像が見つかりませんでした';$('start').disabled=false;return}const a=document.createElement('a');a.href=URL.createObjectURL(x.blob);a.download=selected.name.replace(/\.xlsx$/i,'')+'_images.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);$('result').className='result ok';$('result').textContent=x.count+'枚の画像を抽出してZIPを保存しました';$('start').textContent='完了'}).catch(e=>{$('result').className='result err';$('result').textContent='エラー: '+e.message;$('start').disabled=false;$('start').textContent='再試行'});r.readAsArrayBuffer(selected)};
</script></body></html>
