<script src="../assets/js/security-store.js?v=20261007-sec1"></script><script>
(async()=>{await KoujiSecurity.ready;
/* ===== 小田急線 駅データ：町田からの経路キロ程 ===== */
const ST = {
  "町田":{km:0},
  // --- 小田原線 新宿方面 ---
  "玉川学園前":{km:1.8},"鶴川":{km:4.4},"柿生":{km:6.8},"新百合ヶ丘":{km:8.8},
  "百合ヶ丘":{km:9.9},"読売ランド前":{km:11.2},"生田":{km:12.4},"向ヶ丘遊園":{km:14.5},
  "登戸":{km:15.2},"和泉多摩川":{km:16.3},"狛江":{km:17.3},"喜多見":{km:18.4},
  "成城学園前":{km:19.8},"祖師ヶ谷大蔵":{km:21.0},"千歳船橋":{km:22.1},"経堂":{km:23.4},
  "豪徳寺":{km:24.3},"梅ヶ丘":{km:25.2},"世田谷代田":{km:26.1},"下北沢":{km:26.7},
  "東北沢":{km:27.4},"代々木上原":{km:28.0},"代々木八幡":{km:28.7},"参宮橋":{km:29.7},
  "南新宿":{km:30.8},"新宿":{km:31.5},
  // --- 小田原線 小田原方面 ---
  "相模大野":{km:3.4},"小田急相模原":{km:5.8},"相武台前":{km:8.7},"座間":{km:10.5},
  "海老名":{km:14.0},"厚木":{km:15.2},"本厚木":{km:16.3},"愛甲石田":{km:19.6},
  "伊勢原":{km:23.0},"鶴巻温泉":{km:26.8},"東海大学前":{km:27.9},"秦野":{km:31.5},
  "渋沢":{km:35.4},"新松田":{km:41.6},"開成":{km:43.6},"栢山":{km:45.0},
  "富水":{km:46.2},"螢田":{km:47.4},"足柄":{km:48.6},"小田原":{km:50.0},
  // --- 多摩線 ---
  "五月台":{km:10.4},"栗平":{km:11.5},"黒川":{km:13.3},"はるひ野":{km:14.1},
  "小田急永山":{km:15.9},"小田急多摩センター":{km:17.4},"唐木田":{km:18.9},
  // --- 江ノ島線 ---
  "東林間":{km:5.0},"中央林間":{km:6.3},"南林間":{km:7.2},"鶴間":{km:8.3},
  "大和":{km:9.9},"桜ヶ丘":{km:12.0},"高座渋谷":{km:14.0},"長後":{km:16.3},
  "湘南台":{km:18.4},"六会日大前":{km:20.0},"善行":{km:22.4},"藤沢本町":{km:24.1},
  "藤沢":{km:25.4},"本鵠沼":{km:26.9},"鵠沼海岸":{km:27.8},"片瀬江ノ島":{km:28.6}
};

/* 路線グループ（駅間距離を経路に沿って正しく出すための系統定義） */
const LINES = {
  odawaraShinjuku:["町田","玉川学園前","鶴川","柿生","新百合ヶ丘","百合ヶ丘","読売ランド前","生田","向ヶ丘遊園","登戸","和泉多摩川","狛江","喜多見","成城学園前","祖師ヶ谷大蔵","千歳船橋","経堂","豪徳寺","梅ヶ丘","世田谷代田","下北沢","東北沢","代々木上原","代々木八幡","参宮橋","南新宿","新宿"],
  odawaraSouth:["町田","相模大野","小田急相模原","相武台前","座間","海老名","厚木","本厚木","愛甲石田","伊勢原","鶴巻温泉","東海大学前","秦野","渋沢","新松田","開成","栢山","富水","螢田","足柄","小田原"],
  tama:["町田","新百合ヶ丘","五月台","栗平","黒川","はるひ野","小田急永山","小田急多摩センター","唐木田"],
  enoshima:["町田","相模大野","東林間","中央林間","南林間","鶴間","大和","桜ヶ丘","高座渋谷","長後","湘南台","六会日大前","善行","藤沢本町","藤沢","本鵠沼","鵠沼海岸","片瀬江ノ島"]
};

/* 小田急 距離帯運賃表 [上限km, きっぷ, IC] */
const FARE_TABLE = [
  [3, 140, 136],[6, 160, 157],[9, 190, 189],[12, 220, 220],[15, 250, 251],
  [18, 280, 283],[21, 310, 314],[24, 340, 346],[27, 370, 377],[31, 400, 398],
  [35, 420, 419],[39, 460, 461],[43, 500, 502],[47, 540, 544],[51, 590, 586],
  [55, 630, 627],[999, 670, 669]
];
function fareFromKm(km, ft){
  for(const [max,tk,ic] of FARE_TABLE){
    if(km<=max+1e-6) return ft==="ic"?ic:tk;
  }
  return ft==="ic"?669:670;
}

/* 2駅間のキロ */
function kmBetween(a,b){
  if(a===b) return 0;
  for(const key in LINES){
    const arr=LINES[key];
    if(arr.indexOf(a)>=0 && arr.indexOf(b)>=0) return Math.abs(ST[a].km-ST[b].km);
  }
  const hubs=["相模大野","新百合ヶ丘","町田"];
  let best=Infinity;
  for(const h of hubs){
    const ka=reachKm(a,h), kb=reachKm(b,h);
    if(ka!=null&&kb!=null) best=Math.min(best,ka+kb);
  }
  return best===Infinity?Math.abs(ST[a].km-ST[b].km):best;
}
function reachKm(st,hub){
  if(st===hub) return 0;
  for(const key in LINES){
    const arr=LINES[key];
    if(arr.includes(st)&&arr.includes(hub)) return Math.abs(ST[st].km-ST[hub].km);
  }
  return null;
}
function legFare(from,to,ft){
  if(from===to) return 0;
  return fareFromKm(kmBetween(from,to),ft);
}

const STATIONS=Object.keys(ST).filter(s=>s!=="町田");

/* ===== 状態 ===== */
const KEY="odakyu_fare_note_v2";
let data=JSON.parse(KoujiSecurity.getText(KEY)||"{}");
let ft="ic";
let cur=new Date(), Y=cur.getFullYear(), M=cur.getMonth();
let editKey=null;

document.querySelectorAll("#fareSeg button").forEach(b=>{
  b.onclick=()=>{ft=b.dataset.ft;document.querySelectorAll("#fareSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById("ftLabel").textContent=ft==="ic"?"ICカード":"きっぷ";render();};
});
function shiftMonth(d){M+=d;if(M<0){M=11;Y--;}if(M>11){M=0;Y++;}render();}
function dkey(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}

function entryTotal(e,ft){
  let total=0,prev="町田";
  for(const s of e.legs){total+=legFare(prev,s,ft);prev=s;}
  if(e.roundTrip) total+=legFare(prev,"町田",ft);
  return total;
}

function render(){
  const t=`${Y}年 ${M+1}月`;
  document.getElementById("monthTitle").textContent=t;
  document.getElementById("monthTitlePrint").textContent="🚃 "+t+" 運賃記録";
  const first=new Date(Y,M,1), startDow=first.getDay();
  const dim=new Date(Y,M+1,0).getDate();
  const tb=document.getElementById("calBody");tb.innerHTML="";
  const today=new Date();
  let day=1-startDow, mTotal=0, wDays=0, trips=0;
  for(let w=0;w<6&&day<=dim;w++){
    const tr=document.createElement("tr");
    for(let dow=0;dow<7;dow++,day++){
      const td=document.createElement("td");
      if(day<1||day>dim){td.className="other";}
      else{
        if(dow===0)td.classList.add("sun");if(dow===6)td.classList.add("sat");
        if(Y===today.getFullYear()&&M===today.getMonth()&&day===today.getDate())td.classList.add("today");
        td.classList.add("clickable");
        const thisDay=day;                       // ← 各セルの日付を固定
        const k=dkey(Y,M,thisDay);
        td.innerHTML=`<div class="daynum">${thisDay}</div>`;
        const es=data[k]||[];
        let dTotal=0;
        if(es.length){
          const box=document.createElement("div");box.className="entries";
          es.forEach(e=>{
            const v=entryTotal(e,ft);dTotal+=v;trips++;
            const c=document.createElement("div");c.className="chip";
            c.textContent=(e.memo?"📍"+e.memo+" ":"")+e.legs.join("→")+" "+v+"円";
            box.appendChild(c);
          });
          td.appendChild(box);
          const dt=document.createElement("div");dt.className="day-total";dt.textContent=dTotal+"円";
          td.appendChild(dt);
          mTotal+=dTotal;wDays++;
        }else{
          const p=document.createElement("div");p.className="plus";p.textContent="＋";td.appendChild(p);
        }
        td.onclick=()=>openModal(k,thisDay);     // ← 固定した日付を渡す
      }
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  document.getElementById("monthTotal").textContent=mTotal.toLocaleString()+"円";
  document.getElementById("dayCount").textContent="記録のある日："+wDays+"日";
  document.getElementById("tripCount").textContent="行程数："+trips+"件";
}

/* ===== モーダル ===== */
function opts(sel){return STATIONS.map(s=>`<option ${s===sel?"selected":""}>${s}</option>`).join("");}
function addLeg(v){
  const c=document.getElementById("legs");
  const div=document.createElement("div");div.className="leg";
  div.innerHTML=`<span class="from"></span>
    <select onchange="updatePreview()">${opts(v||STATIONS[0])}</select>
    <span class="fare"></span>
    <button class="del" onclick="this.parentNode.remove();updatePreview()">×</button>`;
  c.appendChild(div);updatePreview();
}
function openModal(k,day){
  editKey=k;
  document.getElementById("modalTitle").textContent=`${Y}年${M+1}月${day}日 の行程`;
  document.getElementById("legs").innerHTML="";
  addLeg();
  document.getElementById("rt").checked=true;
  document.getElementById("memo").value="";
  renderExisting(k);updatePreview();
  document.getElementById("overlay").classList.add("open");
}
function closeModal(){document.getElementById("overlay").classList.remove("open");editKey=null;}
function legStations(){return [...document.querySelectorAll("#legs select")].map(s=>s.value);}
function updatePreview(){
  const rt=document.getElementById("rt").checked;
  const rows=document.querySelectorAll("#legs .leg");
  let prev="町田",total=0,route="町田";
  rows.forEach(r=>{
    const to=r.querySelector("select").value;
    const f=legFare(prev,to,ft);
    r.querySelector(".from").textContent=prev+" →";
    r.querySelector(".fare").textContent=f+"円";
    total+=f;prev=to;route+="→"+to;
  });
  if(rt){total+=legFare(prev,"町田",ft);route+="→町田";}
  document.getElementById("entryTotal").textContent=total.toLocaleString()+"円";
  document.getElementById("routePreview").textContent="経路："+route;
}
function saveEntry(){
  if(!editKey)return;
  const legs=legStations();if(!legs.length){alert("行き先を選んでね");return;}
  (data[editKey]=data[editKey]||[]).push({legs,roundTrip:document.getElementById("rt").checked,memo:document.getElementById("memo").value.trim()});
  save();renderExisting(editKey);render();
  document.getElementById("legs").innerHTML="";addLeg();
  document.getElementById("memo").value="";document.getElementById("rt").checked=true;updatePreview();
}
function renderExisting(k){
  const box=document.getElementById("existing");const es=data[k]||[];
  if(!es.length){box.innerHTML='<div class="note">まだ登録がありません 🌱</div>';return;}
  box.innerHTML="<div style='font-size:12px;font-weight:bold;color:#c67;margin-bottom:6px;'>登録済み</div>";
  es.forEach((e,i)=>{
    const route="町田→"+e.legs.join("→")+(e.roundTrip?"→町田":"");
    const d=document.createElement("div");d.className="exi";
    d.innerHTML=`<span>${e.memo?"📍"+e.memo+" ":""}${route} <b style="color:#2bb08a;">${entryTotal(e,ft)}円</b></span>`;
    const del=document.createElement("button");del.className="del";del.textContent="削除";
    del.onclick=()=>{data[k].splice(i,1);if(!data[k].length)delete data[k];save();renderExisting(k);render();};
    d.appendChild(del);box.appendChild(d);
  });
}

/* ===== 保存・入出力 ===== */
function save(){KoujiSecurity.write(KEY,data);}
function clearMonth(){
  if(!confirm(`${Y}年${M+1}月の記録を全部消しますか？`))return;
  const pre=`${Y}-${String(M+1).padStart(2,"0")}-`;
  Object.keys(data).forEach(k=>{if(k.startsWith(pre))delete data[k];});
  save();render();
}
function exportData(){
  const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="odakyu_fare_note.json";a.click();
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const imp=JSON.parse(r.result);
    if(confirm("既存データに統合しますか？（キャンセルで全置換）"))Object.assign(data,imp);else data=imp;
    save();render();}catch(e){alert("読み込み失敗");}};
  r.readAsText(f);ev.target.value="";
}

render();
})();
</script>
</body>
